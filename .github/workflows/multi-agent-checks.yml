name: Multi-agent checks

on:
  push:
    branches:
      - feature/multi-agent-rag
  pull_request:
    branches:
      - main

jobs:
  syntax-and-specialist-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2,<3" pytest

      - name: Compile project Python files
        run: python -m compileall -q agent llm models rag utils tests

      - name: Run specialist-agent unit tests
        run: python -m pytest -q tests/test_multi_agent.py
